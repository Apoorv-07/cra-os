name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (API)
        run: npm run lint --workspace @cra/api

      - name: Lint (web)
        run: npm run lint --workspace @cra/web

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations apply cleanly
        run: npm run db:migrate
        env:
          DATABASE_PATH: data/ci.db

      - name: Unit + integration tests
        run: npm run test

      - name: End-to-end journey
        run: npm run test:e2e

      - name: Frontend render tests
        run: npm run test --workspace @cra/web

      - name: Build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical

  github-action:
    name: GitHub Action builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bundle the composite action
        run: node action/build.mjs
      - name: The committed bundle is up to date
        run: git diff --exit-code -- action/dist || (echo "::error::action/dist is stale — run 'node action/build.mjs' and commit" && exit 1)

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f infra/docker/Dockerfile -t cra-compliance-os:ci .
